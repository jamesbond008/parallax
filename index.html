    <script>
      // Prevent Web3 wallet extension conflicts (MetaMask, Rabby, Coinbase) from throwing in sandboxed iframes
      (function() {
        var _ethereum = window.ethereum;
        try {
          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _ethereum;
            },
            set: function(val) {
              _ethereum = val;
            }
          });
        } catch (e) {
          // Ignore if property is already non-configurable
        }

        function isWalletError(msg) {
          if (!msg || typeof msg !== 'string') return false;
          var str = msg.toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('redefine property: ethereum') !== -1 ||
            str.indexOf('failed to connect to metamask') !== -1
          );
        }

        window.addEventListener(
          'error',
          function(event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (isWalletError(msg)) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function(event) {
            var reason = event && event.reason;
            var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
            if (isWalletError(msg)) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          },
          true
        );
      })();
    </script>
